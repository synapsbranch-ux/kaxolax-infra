name: terraform

# Format, validation, tests (fournisseur simulé), shellcheck et gitleaks à chaque push et PR.
# L'image de sauvegarde est construite et testée par la CI de kaxolax-platform (scripts/backup). Le plan (PR et main) et l'apply (main, environnement GitHub « production »)
# s'activent quand l'état R2 et les variables du dépôt sont posés (docs/procedure.md) :
#   variables : CLOUDFLARE_ACCOUNT_ID, PRODUCTION_DOMAIN, TF_STATE_BUCKET, TF_STATE_ENDPOINT,
#               TF_RAILWAY_TARGETS (JSON), TF_EXTRA_DNS_RECORDS (JSON), TF_SSL_MODE
#   secrets   : CLOUDFLARE_API_TOKEN, TF_STATE_ACCESS_KEY_ID, TF_STATE_SECRET_ACCESS_KEY
# Le dossier legacy/ (AWS, étape 1) n'est plus validé : seul son format est contrôlé.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.16.4
  # terraform_1.16.4_linux_amd64.zip (releases.hashicorp.com, fichier SHA256SUMS).
  TERRAFORM_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  CHECKPOINT_DISABLE: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        run: &install-terraform |
          curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum --check
          sudo unzip -o -q terraform.zip terraform -d /usr/local/bin
          rm terraform.zip
          terraform version

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform -chdir=cloudflare init -backend=false
          terraform -chdir=cloudflare validate

      # Fournisseur simulé : toute la configuration est évaluée sans compte Cloudflare.
      - name: Test
        run: terraform -chdir=cloudflare test

      - name: Shellcheck
        run: shellcheck -x railway/*.sh

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  plan:
    needs: validate
    # Jamais pour une PR venue d'un fork (le jeton de Terraform a des droits d'écriture).
    if: >-
      vars.TF_STATE_BUCKET != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: &production-env
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_domain: ${{ vars.PRODUCTION_DOMAIN }}
      TF_VAR_railway_targets: ${{ vars.TF_RAILWAY_TARGETS || '{}' }}
      TF_VAR_extra_dns_records: ${{ vars.TF_EXTRA_DNS_RECORDS || '[]' }}
      TF_VAR_ssl_mode: ${{ vars.TF_SSL_MODE || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Terraform
        run: *install-terraform
      - name: Plan
        working-directory: cloudflare
        run: |
          printf 'bucket = "%s"\nendpoints = { s3 = "%s" }\n' "$TF_STATE_BUCKET" "$TF_STATE_ENDPOINT" > backend.hcl
          terraform init -backend-config=backend.hcl
          terraform plan -lock=false -no-color

  apply:
    needs: [validate, gitleaks, plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_STATE_BUCKET != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Règles de protection (approbation) réglées sur l'environnement GitHub.
    environment: production
    env: *production-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Terraform
        run: *install-terraform
      - name: Apply
        working-directory: cloudflare
        run: |
          printf 'bucket = "%s"\nendpoints = { s3 = "%s" }\n' "$TF_STATE_BUCKET" "$TF_STATE_ENDPOINT" > backend.hcl
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -no-color
